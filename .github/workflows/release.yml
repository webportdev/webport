name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: ./scripts/install_test.sh
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              work="dist/webport_${version}_${os}_${arch}"
              mkdir -p "$work"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$work/" ./cmd/webport ./cmd/webportctl ./cmd/webport-dns
              tar -C "$work" -czf "dist/webport_${version}_${os}_${arch}.tar.gz" webport webportctl webport-dns
            done
          done
          installer="dist/webport-installer_${version}"
          mkdir -p "$installer"
          cp README.md "$installer/"
          mkdir -p "$installer/scripts" "$installer/systemd" "$installer/macos" "$installer/caddy"
          cp scripts/install.sh scripts/install-macos.sh scripts/bootstrap-install.sh scripts/build-caddy-docker.sh scripts/versions.env "$installer/scripts/"
          cp systemd/webport.service systemd/caddy.service systemd/webport.env.example "$installer/systemd/"
          cp macos/Caddyfile macos/run-caddy macos/run-webport macos/com.webport.caddy.plist macos/com.webport.webport.plist "$installer/macos/"
          cp caddy/Caddyfile "$installer/caddy/"
          tar -C dist -czf "dist/webport-installer_${version}.tar.gz" "webport-installer_${version}"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
