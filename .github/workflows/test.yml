name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: ./scripts/install_test.sh
      - run: ./scripts/install_macos_test.sh
      - run: xmllint --noout --nonet macos/com.webport.caddy.plist macos/com.webport.webport.plist
      - name: Cross-build supported targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/webport-build
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="/tmp/webport-build/${os}_${arch}"
              mkdir -p "$out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$out/" ./cmd/webport ./cmd/webportctl ./cmd/webport-dns
            done
          done
