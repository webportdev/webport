name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./scripts/install_test.sh
      - run: ./scripts/install_macos_test.sh
      - run: python3 -c "import pathlib, plistlib; [plistlib.load(path.open('rb')) for path in map(pathlib.Path, ['macos/com.webport.traefik.plist', 'macos/com.webport.webport.plist'])]"
      - name: Reject obsolete Caddy documentation
        shell: bash
        run: |
          ! grep -E 'WEBPORT_CADDY|WEBPORT_TLS_DNS|internal/caddy|Caddyfile' \
            README.md verify.md scripts/README.md MIGRATION.md
      - name: Test real Traefik file-provider updates
        shell: bash
        run: |
          set -euo pipefail
          source scripts/versions.env
          base="https://github.com/traefik/traefik/releases/download/$TRAEFIK_VERSION"
          curl -fsSL -o /tmp/traefik.tar.gz "$base/traefik_${TRAEFIK_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/traefik-checksums.txt "$base/traefik_${TRAEFIK_VERSION}_checksums.txt"
          expected=$(grep " traefik_${TRAEFIK_VERSION}_linux_amd64.tar.gz$" /tmp/traefik-checksums.txt | awk '{print $1}')
          actual=$(sha256sum /tmp/traefik.tar.gz | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"
          mkdir -p /tmp/traefik-bin
          tar -xzf /tmp/traefik.tar.gz -C /tmp/traefik-bin
          TRAEFIK_BIN=/tmp/traefik-bin/traefik ./scripts/traefik_integration_test.sh
      - name: Cross-build supported targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/webport-build
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="/tmp/webport-build/${os}_${arch}"
              mkdir -p "$out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$out/" ./cmd/webport ./cmd/webportctl ./cmd/webport-dns
            done
          done
